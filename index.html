<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blockverse</title>
  <meta name="description" content="A voxel sandbox for the browser: mine, craft, and ride wind vents up to floating sky islands." />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <!-- HUD (crosshair, hotbar, status bars, debug) -->
    <div id="hud" class="hidden">
      <div id="crosshair">+</div>
      <div id="status-bars">
        <div id="health-bar" class="stat-bar"></div>
        <div id="air-bar" class="stat-bar"></div>
        <div id="hunger-bar" class="stat-bar"></div>
      </div>
      <div id="hotbar"></div>
      <div id="held-item-label"></div>
      <div id="debug-overlay" class="hidden"></div>
      <div id="chat-log"></div>
      <div id="chat-input-row" class="hidden"><input id="chat-input" autocomplete="off" spellcheck="false" maxlength="256" /></div>
    </div>
    <!-- Full-screen UI layers -->
    <div id="ui-root"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
